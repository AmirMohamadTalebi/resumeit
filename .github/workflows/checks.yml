name: Security and browser checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
# A newer push to the same branch makes an unfinished run pointless; stop it instead of queueing behind it.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Server, security and database checks; the only job that needs MySQL.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: resumeit-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -presumeit-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: resumeit-ci-only
      RI_JOBS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # The e-Namad seal host does not answer runners outside Iran, so the page load event never fires; fail it fast.
      - run: echo "0.0.0.0 trustseal.enamad.ir" | sudo tee -a /etc/hosts
      - run: npm test
      - run: npm run check:database

  # Browser checks split across three machines; tests/run-parallel.cjs balances the shares by known durations.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      RI_SHARD: ${{ matrix.shard }}/3
      RI_JOBS: '3'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: echo "0.0.0.0 trustseal.enamad.ir" | sudo tee -a /etc/hosts
      - run: >-
          node tests/run-parallel.cjs suite:ui npm:check:enamad npm:check:public-audit npm:check:account-audit
          npm:check:template-editor npm:check:editor-audit npm:check:workspace-audit npm:check:staged-loading npm:check:advisor
