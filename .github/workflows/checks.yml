name: Security and browser checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: resumeit-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -presumeit-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: resumeit-ci-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      # The e-Namad seal host does not answer runners outside Iran, so the page load event never fires; fail it fast.
      - run: echo "0.0.0.0 trustseal.enamad.ir" | sudo tee -a /etc/hosts
      - run: npm test
      - run: npm run check:database
      - run: npm run check:ui
      - run: npm run check:enamad
      - run: npm run check:public-audit
      - run: npm run check:account-audit
      - run: npm run check:template-editor
      - run: npm run check:editor-audit
      - run: npm run check:workspace-audit
      - run: npm run check:staged-loading
