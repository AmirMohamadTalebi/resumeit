<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <script defer src="/dashboard/js/session.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dbe7ed">
  <title>داشبورد | ResumeIt</title>
  <meta name="description" content="داشبورد ساخت رزومه و صفحهٔ لینک شخصی ResumeIt ">
  <link rel="stylesheet" href="/dashboard/css/workspace.css">
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/page-loading.css"><link rel="stylesheet" href="/notifications.css"><script defer src="/notifications.js"></script><link rel="stylesheet" href="/brand/brand.css"><link rel="stylesheet" href="/fonts/fonts.css">
</head>
<body data-page="stats"><script src="/page-loading.js"></script>
  <a class="skip-link" href="#view">رفتن به محتوای اصلی</a>

  <div class="app">
    <aside class="sidebar" id="sidebar" data-open="false" aria-label="ناوبری اصلی"></aside>
    <div class="scrim" id="scrim" data-open="false"></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="btn btn--icon btn--ghost topbar__menu" id="menuBtn" aria-label="باز کردن منو" aria-expanded="false"></button>
        <span class="topbar__crumb">ResumeIt /</span>
        <span class="topbar__title" id="topTitle">خانه</span>
        <span class="topbar__spacer"></span>
        <div class="topbar__actions">
          <span class="save-state" id="saveState" data-state="saved" title="تغییرات به‌صورت خودکار ذخیره می‌شوند"></span>
          <button type="button" class="btn btn--soft btn--sm" id="topPreview" aria-label="پیش‌نمایش"></button>
          <span class="save-countdown" id="saveBtn" role="timer" aria-live="off" hidden></span>
          <button type="button" class="btn btn--soft btn--sm" id="undoBtn" aria-label="واگرد آخرین تغییر" title="واگرد آخرین تغییر" disabled></button>
        </div>
      </header>
      <div class="save-error" id="saveError" role="alert" hidden></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="میانبر"></nav>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script defer src="/dashboard/js/workspace.js"></script>
  <script defer src="/dashboard/js/pages/stats.js"></script>
</body>
</html>
