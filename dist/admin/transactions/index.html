<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>مدیریت | ResumeIt</title>
    <link rel="icon" href="/brand/favicon.svg" />
    <link rel="stylesheet" href="/dashboard/css/tokens.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <script defer src="/dashboard/js/icons.js"></script>
    <script defer src="/admin/admin.js"></script>
    <script defer src="/version.js"></script>
  </head>
  <body data-section="transactions">
    <a class="sr-only" href="#content">رفتن به محتوای اصلی</a>
    <div class="admin-shell">
      <aside class="admin-side" id="admin-side" data-open="false">
        <button class="btn" id="admin-close" aria-label="بستن منو">
          بستن منو</button
        ><a class="admin-brand" href="/admin/"
          ><img src="/brand/resumeit-logo-v1.png" alt="ResumeIt"
        /></a>
        <nav class="admin-nav" id="admin-nav" aria-label="بخش‌های مدیریت"></nav>
        <footer>
          <strong id="admin-name">مدیریت ResumeIt</strong
          ><span data-site-version></span
          ><button class="btn" id="logout">خروج از حساب</button>
        </footer>
      </aside>
      <div class="admin-backdrop" id="admin-backdrop" data-open="false"></div>
      <div class="admin-main">
        <header class="admin-head">
          <button
            class="btn"
            id="admin-menu"
            aria-label="باز کردن منو"
            aria-expanded="false"
          ></button
          ><strong>مدیریت / <span id="section-title">نمای کلی</span></strong
          ><a class="btn" href="/dashboard/" id="user-panel">پنل کاربری</a
          ><button class="btn" id="refresh">به‌روزرسانی</button>
        </header>
        <main class="admin-view">
          <div class="page-intro">
            <div>
              <h1 id="page-title">مدیریت ResumeIt</h1>
              <p id="page-desc"></p>
            </div>
          </div>
          <form class="filters" id="filters">
            <label id="search-wrap"
              ><span class="sr-only">جست‌وجو</span
              ><input
                class="input"
                id="search"
                placeholder="جست‌وجو در این بخش…"
                maxlength="100"
              /><button class="btn" type="submit">جست‌وجو</button></label
            ><label id="days-wrap"
              >بازه<select id="days">
                <option value="7">۷ روز</option>
                <option value="30" selected>۳۰ روز</option>
                <option value="90">۹۰ روز</option>
                <option value="365">یک سال</option>
              </select></label
            ><label id="status-wrap">وضعیت<select id="status"></select></label
            ><button class="btn" type="button" id="export" disabled>
              خروجی CSV این صفحه
            </button>
          </form>
          <div class="filters catalog-controls" id="catalog-controls" hidden>
            <label
              >محصول<select id="catalog-kind">
                <option value="templates">قالب‌های رزومه</option>
                <option value="linkTemplates">قالب‌های لینک</option>
                <option value="fonts">فونت‌ها</option>
                <option value="palettes">پالت‌های رنگ</option>
                <option value="plans">اشتراک‌ها</option>
              </select></label
            >
          </div>
          <div id="content" tabindex="-1">
            <div class="loading" role="status">در حال آماده‌سازی پنل…</div>
          </div>
          <p class="updated" id="updated"></p>
        </main>
      </div>
    </div>
    <dialog class="modal" id="action-dialog" aria-labelledby="action-title">
      <div class="modal-box">
        <h2 id="action-title"></h2>
        <p id="action-explain"></p>
        <form class="action-form" id="action-form">
          <label id="amount-field"
            >مبلغ شارژ به تومان<input
              class="input"
              id="amount"
              type="number"
              min="2000"
              max="100000000"
              step="2000"
            /><small>هر ۲٬۰۰۰ تومان برابر با یک It است.</small></label
          ><label
            >دلیل عملیات<textarea
              id="reason"
              required
              minlength="5"
              maxlength="500"
              placeholder="دلیل این تغییر را بنویسید…"
            ></textarea>
          </label>
          <p id="action-error" role="alert"></p>
          <div class="modal-action">
            <button class="btn" type="button" id="action-cancel">انصراف</button
            ><button class="btn btn-primary" type="submit" id="action-submit">
              تأیید عملیات
            </button>
          </div>
        </form>
      </div>
    </dialog>
  </body>
</html>
