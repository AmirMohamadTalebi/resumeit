<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b141b">
<title>صفحه پیدا نشد | ResumeIt</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Vazirmatn;src:url(/assets/fonts/Vazirmatn.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--night:#0b141b;--night-2:#122230;--night-3:#1b3242;--gold:#f0bd52;--gold-2:#e2a03a;--gold-ink:#2b1a05;--sky:#8ec5d6;--teal:#3d8c9c;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.4,.5,1)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{min-height:100dvh;display:flex;flex-direction:column;background:var(--night) radial-gradient(120% 90% at 70% 0%,var(--night-3) 0%,var(--night-2) 38%,var(--night) 75%) fixed;color:#e6eef2;font:16px/1.9 Vazirmatn,Tahoma,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
::selection{background:rgba(240,189,82,.35)}

/* The same night sky as the homepage: drifting auroras, two layers of stars, a moving grid floor and a comet. */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sky i{position:absolute;display:block}
.aurora{inset:-20%;filter:blur(70px);opacity:.72}
.aurora b{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 18s ease-in-out infinite alternate}
.aurora b:nth-child(1){width:50vmax;height:40vmax;top:-8%;right:-6%;background:radial-gradient(circle,rgba(240,189,82,.5),transparent 65%)}
.aurora b:nth-child(2){width:46vmax;height:46vmax;top:30%;left:-14%;background:radial-gradient(circle,rgba(61,140,156,.55),transparent 65%);animation-duration:22s;animation-delay:-6s}
.aurora b:nth-child(3){width:36vmax;height:30vmax;bottom:-12%;right:22%;background:radial-gradient(circle,rgba(135,90,54,.65),transparent 65%);animation-duration:26s;animation-delay:-12s}
.stars{inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 32% 68%,#fff,transparent),radial-gradient(1.5px 1.5px at 72% 18%,#fff,transparent),radial-gradient(1px 1px at 86% 54%,#fff,transparent),radial-gradient(1px 1px at 54% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 22% 84%,#fff,transparent),radial-gradient(1px 1px at 92% 82%,#fff,transparent);background-size:640px 640px;opacity:.6;animation:twinkle 5s ease-in-out infinite alternate}
.stars+.stars{background-image:radial-gradient(1px 1px at 8% 60%,#cfe6ee,transparent),radial-gradient(1px 1px at 44% 12%,#fff3c4,transparent),radial-gradient(1px 1px at 66% 74%,#fff,transparent),radial-gradient(1px 1px at 78% 36%,#cfe6ee,transparent),radial-gradient(1px 1px at 28% 46%,#fff,transparent);background-size:420px 420px;opacity:.4;animation-duration:7s;animation-delay:-3s}
.floor{left:-50%;right:-50%;bottom:-10%;height:42%;background-image:linear-gradient(rgba(142,197,214,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(142,197,214,.16) 1px,transparent 1px);background-size:64px 64px;transform:perspective(700px) rotateX(64deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%);animation:floor 6s linear infinite}
.comet{top:12%;left:-12%;width:150px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9) 70%,var(--gold));transform:rotate(16deg);opacity:0;animation:comet 10s 1.5s linear infinite}

/* Glass header, like the site's. */
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(1220px,calc(100% - 32px));height:64px;margin:16px auto 0;padding-inline:18px 10px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 20px 40px -24px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);animation:drop .9s var(--spring) both}
.logo{position:relative;display:block;width:132px;height:27px;overflow:hidden;border-radius:8px}
.logo img{position:absolute;width:112%;height:auto;left:-6%;top:50%;transform:translateY(-50%);filter:brightness(0) invert(1)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);font-size:13px;font-weight:700;transition:background .3s,color .3s,transform .45s var(--spring)}
.chip:hover{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);transform:translateY(-2px)}
svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* «۴۰۴» where the zero is a small golden planet with a ring and a moon, since the Persian zero is a dot. */
main{position:relative;z-index:1;flex:1;display:grid;place-items:center;padding:40px 16px 56px;text-align:center}
.nf{display:grid;justify-items:center;gap:14px;width:min(100%,640px)}
.code{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,30px);direction:ltr;font-size:clamp(108px,22vw,210px);font-weight:900;line-height:1;margin-bottom:4px}
.code>span{display:inline-block;background:linear-gradient(180deg,#fff 12%,var(--gold) 58%,#c98a2b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 18px 40px rgba(240,189,82,.28));animation:enter 1s var(--spring) both,float 5s 1s ease-in-out infinite alternate}
.code>span:last-child{animation-delay:.18s,-1.5s}
.planet{position:relative;width:clamp(82px,15vw,148px);aspect-ratio:1;animation:enter 1.1s var(--spring) .08s both}
.ball{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff3c4,var(--gold) 36%,#b9792a 74%,#6b4629);box-shadow:inset -14px -18px 30px rgba(43,26,5,.55),0 0 70px rgba(240,189,82,.45);animation:breathe 4s ease-in-out infinite alternate}
.ball::after{content:"";position:absolute;inset:18% 22% 52% 30%;border-radius:50%;background:rgba(255,255,255,.35);filter:blur(6px)}
.ring{position:absolute;inset:36% -36%;border-radius:50%;border:3px solid rgba(142,197,214,.8);box-shadow:0 0 18px rgba(142,197,214,.45);transform:rotate(-16deg)}
.ring--front{clip-path:inset(50% 0 0 0)}
.ring--back{clip-path:inset(0 0 50% 0);opacity:.55}
.moon{position:absolute;inset:-28%;animation:orbit 7s linear infinite}
.moon::after{content:"";position:absolute;top:0;left:50%;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:#e8f4f8;box-shadow:0 0 16px var(--sky)}
.spark{position:absolute;color:var(--gold);font-size:18px;line-height:1;animation:spark 2.6s ease-in-out infinite}
.spark:nth-of-type(1){top:-6%;right:-14%}.spark:nth-of-type(2){bottom:2%;left:-18%;font-size:12px;animation-delay:-1.2s}
h1{margin:0;font-size:clamp(26px,4vw,40px);font-weight:900;line-height:1.5;color:#fff;animation:enter .9s var(--spring) .3s both}
.lead{max-width:34em;margin:0;color:#c9d7df;animation:enter .9s var(--spring) .42s both}
.addr{display:inline-flex;align-items:center;gap:10px;max-width:100%;margin:4px 0 0;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#9fb5c2;font-size:14px;animation:enter .9s var(--spring) .52s both}
.addr svg{color:#e5867a}
.addr bdi{position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Consolas,monospace;color:#dfe8ee}
.addr bdi::after{content:"";position:absolute;left:0;right:0;top:54%;height:2px;border-radius:2px;background:#e5867a;transform:scaleX(0);transform-origin:0 50%;animation:strike .8s 1.3s var(--ease) forwards}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:14px;animation:enter .9s var(--spring) .62s both}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font-weight:800;font-size:15px;overflow:hidden;isolation:isolate;transition:transform .45s var(--spring),box-shadow .35s,background .3s,color .3s}
.btn--gold{background:linear-gradient(135deg,#f7d27c,var(--gold) 42%,var(--gold-2));color:var(--gold-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 18px 36px -16px rgba(226,160,58,.8)}
.btn--gold::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(-130%);animation:sheen 4.8s 1.6s ease-in-out infinite}
.btn--gold:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 24px 44px -16px rgba(240,189,82,.95)}
.btn--gold:hover svg{animation:hop .6s var(--spring)}
.btn--ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#e6eef2}
.btn--ghost:hover{background:rgba(255,255,255,.14);border-color:rgba(240,189,82,.55);transform:translateY(-3px)}
.cat{position:fixed;left:3vw;bottom:0;z-index:1;width:clamp(150px,14vw,230px);pointer-events:none;filter:drop-shadow(0 22px 30px rgba(0,0,0,.6));animation:cat-in 1.1s .5s var(--spring) both,float 5s 1.6s ease-in-out infinite alternate}
@keyframes cat-in{from{opacity:0;translate:-40% 30%;rotate:-12deg}}
@media(max-width:1023px){.cat{display:none}}
.foot{position:relative;z-index:1;padding:0 16px 22px;text-align:center;font-size:13px;color:#7f97a5}
.foot a{color:#c9d7df}.foot a:hover{color:var(--gold)}
@media(max-width:640px){.top{width:calc(100% - 24px);height:58px;margin-top:10px;padding-inline:14px 8px}.logo{width:110px;height:23px}.actions{display:grid;width:100%}.btn{width:100%}.addr{font-size:13px}}

@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,-4%) scale(1.12)}100%{transform:translate(-5%,5%) scale(.95)}}
@keyframes twinkle{from{opacity:.25}to{opacity:.75}}
@keyframes floor{to{background-position:0 64px}}
@keyframes comet{0%{translate:0 0;opacity:0}2%{opacity:1}12%{translate:70vw 22vh;opacity:0}100%{translate:70vw 22vh;opacity:0}}
@keyframes drop{from{opacity:0;translate:0 -24px}}
@keyframes enter{from{opacity:0;translate:0 26px;scale:.9;filter:blur(8px)}}
@keyframes float{to{translate:0 -12px}}
@keyframes breathe{to{box-shadow:inset -14px -18px 30px rgba(43,26,5,.55),0 0 100px rgba(240,189,82,.65)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes spark{0%,100%{opacity:.2;scale:.6;rotate:0deg}50%{opacity:1;scale:1.15;rotate:45deg}}
@keyframes strike{to{transform:none}}
@keyframes sheen{0%,62%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes hop{40%{transform:translateY(-4px) rotate(-10deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.comet{display:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="aurora"><b></b><b></b><b></b></i><i class="stars"></i><i class="stars"></i><i class="floor"></i><i class="comet"></i></div>
<header class="top"><a class="logo" href="{{home}}" aria-label="ResumeIt، صفحهٔ اصلی"><img src="/brand/resumeit-logo-v1.png" alt="ResumeIt" width="2172" height="724"></a><a class="chip" href="{{home}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>صفحهٔ اصلی</a></header>
<main id="main">
<section class="nf" aria-labelledby="nf-title">
<div class="code" role="img" aria-label="خطای ۴۰۴"><span>۴</span><span class="planet"><i class="ring ring--back"></i><i class="ball"></i><i class="ring ring--front"></i><i class="moon"></i><b class="spark">✦</b><b class="spark">✦</b></span><span>۴</span></div>
<h1 id="nf-title">این صفحه پیدا نشد</h1>
<p class="lead">آدرسی که باز کردی وجود ندارد، جابه‌جا شده یا هنوز منتشر نشده است. شاید یک حرفش اشتباه تایپ شده باشد.</p>
<p class="addr"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15 15 9M10 6.5l1.2-1.2a4 4 0 0 1 5.6 5.6L15.5 12M8.5 12l-1.3 1.3a4 4 0 0 0 5.6 5.6l1.2-1.2M3 3l3 3M18 18l3 3"/></svg><bdi dir="ltr">{{address}}</bdi></p>
<div class="actions"><a class="btn btn--gold" href="{{home}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>رفتن به صفحهٔ اصلی رزومیت</a>{{second}}</div>
</section>
</main>
<img class="cat" src="/brand/fandogh/full.webp" alt="" width="518" height="900" aria-hidden="true">
<footer class="foot">© ResumeIt · <a href="{{home}}contact/">ارتباط با پشتیبانی</a></footer>
</body>
</html>
